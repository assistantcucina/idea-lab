<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial OS</title>
<style>
  :root {
    --paper: #faf8f4;
    --surface: #ffffff;
    --surface-soft: #f2efe8;
    --border: #e6e1d6;
    --ink: #1c1a16;
    --muted: #7a7568;
    --faint: #a8a297;
    --accent: #4a4784;
    --accent-soft: #eeedf7;
    --warn: #a3672f;
    --warn-soft: #f6ecdd;
    --established: #1c1a16;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(28, 26, 22, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131211;
      --surface: #1c1a17;
      --surface-soft: #211f1b;
      --border: #322f28;
      --ink: #f2efe8;
      --muted: #9b968a;
      --faint: #6d6a60;
      --accent: #8b87d9;
      --accent-soft: #26244a;
      --warn: #d8a05c;
      --warn-soft: #3a2f1c;
      --established: #f2efe8;
      --glass-bg: rgba(28, 26, 23, 0.72);
      --glass-border: rgba(242, 239, 232, 0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  a { color: inherit; }

  /* ---- App shell ---- */
  #app { min-height: 100vh; padding-bottom: 82px; }
  .screen { max-width: 640px; margin: 0 auto; padding: 20px 18px 40px; animation: fadein 0.18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-border);
  }

  /* ---- Bottom nav (mobile) ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--glass-border);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 6px; font-size: 10px; color: var(--faint); letter-spacing: 0.2px;
    flex: 1; min-width: 0;
  }
  .tab .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; margin-bottom: 1px; }
  .tab.active { color: var(--ink); }
  .tab.active .dot { background: var(--accent); }

  /* ---- Desktop / iPad layout ---- */
  @media (min-width: 860px) {
    #app { display: grid; grid-template-columns: 200px 1fr; padding-bottom: 0; min-height: 100vh; }
    .tabbar {
      position: sticky; top: 0; left: auto; right: auto; bottom: auto;
      flex-direction: column; align-items: stretch; justify-content: flex-start;
      height: 100vh; width: 200px; padding: 28px 10px; border-top: none; border-right: 1px solid var(--glass-border);
      gap: 4px;
    }
    .tab { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 13px; padding: 9px 10px; border-radius: 8px; }
    .tab.active { background: var(--surface-soft); }
    .tab .dot { margin-bottom: 0; }
    .screen { max-width: 760px; padding: 32px 36px 48px; }
    .screen.wide { max-width: 980px; }
  }

  /* ---- Header ---- */
  .day-header { margin-bottom: 22px; }
  .day-header .greeting { font-size: 24px; margin-bottom: 2px; }
  .day-header .date { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .day-header .pulse { font-size: 13px; color: var(--accent); }

  /* ---- Cards ---- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .panel + .panel { margin-top: 12px; }
  .flat { padding-left: 0; padding-right: 0; border: none; background: transparent; }
  .eyebrow { font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .pill { display: inline-block; font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }

  /* What Changed card */
  .wc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .wc-title { font-size: 20px; }
  .wc-quote { font-family: var(--serif); font-size: 16px; line-height: 1.5; margin: 10px 0; padding-left: 12px; border-left: 2px solid var(--accent); }
  .wc-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .wc-evidence-shift { font-family: var(--serif); color: var(--ink); }
  .wc-why { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .wc-cta { font-size: 13px; color: var(--accent); font-weight: 600; }

  /* Observation rows */
  .obs-row { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
  .obs-row:first-child { border-top: none; padding-top: 0; }
  .obs-num { font-size: 11px; color: var(--faint); width: 20px; flex-shrink: 0; padding-top: 2px; }
  .obs-text { font-family: var(--serif); font-size: 15px; line-height: 1.5; margin-bottom: 6px; }
  .obs-source { font-size: 11px; color: var(--muted); }
  .obs-support { font-size: 11px; color: var(--accent); margin-top: 3px; }

  /* Signal cards */
  .signal-row { padding: 14px 0; border-top: 1px solid var(--border); }
  .signal-row:first-child { border-top: none; padding-top: 0; }
  .signal-title { font-family: var(--serif); font-size: 16px; line-height: 1.4; margin: 6px 0 3px; }
  .signal-source { font-size: 12px; color: var(--muted); }
  .signal-summary-label { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--faint); margin-top: 10px; }
  .signal-summary { font-size: 13px; line-height: 1.5; margin: 3px 0 10px; }
  .signal-why { background: var(--surface-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
  .signal-angle-label { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
  .signal-angle { font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .signal-actions { display: flex; gap: 10px; }
  .btn-link { font-size: 13px; font-weight: 600; color: var(--accent); }
  .btn-link.muted { color: var(--muted); }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; -ms-overflow-style: none; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; font-size: 12px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .filter-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Thought map */
  .map-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-bottom: 16px; }
  .map-toggle button { font-size: 12px; padding: 6px 14px; border-radius: 999px; color: var(--muted); }
  .map-toggle button.active { background: var(--ink); color: var(--paper); }
  .graph-wrap { overflow-x: auto; padding: 6px 0 14px; }
  .graph-wrap svg { display: block; margin: 0 auto; }
  .graph-node circle { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
  .graph-node.strengthening circle { stroke: var(--accent); }
  .graph-node.established circle { fill: var(--ink); stroke: var(--ink); }
  .graph-node.challenged circle { stroke-dasharray: 3 2; stroke: var(--warn); }
  .graph-node text { font-family: var(--sans); font-size: 10.5px; fill: var(--ink); }
  .graph-node.established text.glyph { fill: var(--paper); }
  .graph-link { stroke: var(--border); stroke-width: 1.2; fill: none; }
  .graph-node { cursor: pointer; }

  .thesis-row { padding: 16px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .thesis-row:first-child { border-top: none; padding-top: 0; }
  .thesis-row-head { display: flex; align-items: baseline; justify-content: space-between; }
  .thesis-row-title { font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
  .thesis-row-count { font-family: var(--serif); font-size: 15px; color: var(--faint); }
  .thesis-row-belief { font-family: var(--serif); font-size: 17px; line-height: 1.4; margin: 8px 0 8px; }
  .thesis-row-maturity { font-size: 12px; color: var(--accent); margin-bottom: 8px; }
  .thesis-row-stats { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .thesis-row-last { font-size: 11px; color: var(--faint); margin-top: 8px; }

  /* Thesis detail */
  .back-btn { font-size: 13px; color: var(--muted); margin-bottom: 16px; display: inline-flex; align-items: center; gap: 4px; }
  .td-title { font-size: 13px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .td-maturity { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.4px; margin-bottom: 12px; }
  .td-belief { font-family: var(--serif); font-size: 24px; line-height: 1.35; margin-bottom: 16px; }
  .td-dates { display: flex; gap: 24px; font-size: 12px; color: var(--muted); margin-bottom: 26px; }
  .td-dates div span { display: block; color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
  .section-title { font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin: 30px 0 14px; }
  .section-title:first-of-type { margin-top: 0; }

  /* Evolution timeline — the hero interaction */
  .evo { position: relative; padding-left: 22px; }
  .evo::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border); }
  .evo-step { position: relative; padding-bottom: 22px; }
  .evo-step:last-child { padding-bottom: 0; }
  .evo-step::before { content: ""; position: absolute; left: -22px; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--faint); }
  .evo-step.current::before { background: var(--accent); border-color: var(--accent); }
  .evo-date { font-size: 10.5px; letter-spacing: 0.5px; color: var(--faint); text-transform: uppercase; }
  .evo-label { font-family: var(--serif); font-size: 15px; margin: 3px 0 4px; }
  .evo-text { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .evo-belief { font-family: var(--serif); font-size: 17px; line-height: 1.5; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 16px; margin-top: 8px; }

  .evidence-group { margin-bottom: 4px; }
  .evidence-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .evidence-head .n { font-family: var(--serif); font-size: 16px; color: var(--faint); }
  .evidence-item { font-size: 13px; line-height: 1.5; padding: 8px 0; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .evidence-item:first-child { border-top: none; }
  .evidence-item .mark { color: var(--faint); flex-shrink: 0; }
  .evidence-item.challenge .mark { color: var(--warn); }

  .oq-item { font-family: var(--serif); font-size: 15px; line-height: 1.5; padding: 10px 0; border-top: 1px solid var(--border); }
  .oq-item:first-child { border-top: none; }

  /* Ideas */
  .idea-card { padding: 16px 0; border-top: 1px solid var(--border); }
  .idea-card:first-child { border-top: none; padding-top: 0; }
  .idea-title { font-family: var(--serif); font-size: 16px; line-height: 1.4; margin: 6px 0 8px; }
  .idea-stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 5px; border-radius: 3px; background: var(--surface-soft); overflow: hidden; margin-bottom: 8px; }
  .bar-fill { height: 100%; background: var(--accent); }
  .idea-explore { font-size: 12px; color: var(--accent); font-weight: 600; }

  /* Editorials */
  .ed-card { padding: 16px 0; border-top: 1px solid var(--border); }
  .ed-card:first-child { border-top: none; padding-top: 0; }
  .ed-title { font-family: var(--serif); font-size: 17px; line-height: 1.35; margin: 8px 0; }
  .ed-thesis-label { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
  .ed-thesis { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .ed-meta { font-size: 12px; color: var(--faint); }
  .check-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .check-row:first-child { border-top: none; }
  .check-mark { font-size: 13px; }
  .check-mark.pass { color: var(--accent); }
  .check-mark.warn { color: var(--warn); }
  .check-mark.pending { color: var(--faint); }
  .article-preview { font-family: var(--serif); font-size: 15px; line-height: 1.6; color: var(--muted); }
  .actions-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .action-btn { font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); }
  .action-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Archive */
  .archive-month { font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin: 22px 0 4px; }
  .archive-month:first-child { margin-top: 0; }
  .archive-row { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--border); align-items: baseline; }
  .archive-row:first-child { border-top: none; }
  .archive-day { font-family: var(--serif); font-size: 15px; width: 22px; flex-shrink: 0; }
  .archive-kind { font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 2px; }
  .archive-title { font-size: 13px; }

  /* Weekly synthesis */
  .weekly-stats { display: flex; gap: 22px; margin: 16px 0 24px; flex-wrap: wrap; }
  .weekly-stat .n { font-family: var(--serif); font-size: 26px; display: block; }
  .weekly-stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .shift-from, .shift-to { font-family: var(--serif); font-size: 15px; line-height: 1.5; }
  .shift-from { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--border); margin-bottom: 6px; }
  .shift-arrow { color: var(--faint); margin: 4px 0; }
  .opportunity-panel { background: var(--accent-soft); border-radius: 16px; padding: 18px; margin-top: 16px; }

  /* Bottom sheet */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.32); display: flex; align-items: flex-end; z-index: 40; }
  .sheet { width: 100%; max-width: 640px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 3px; margin: 0 auto 16px; }
  .sheet textarea {
    width: 100%; min-height: 90px; border: 1px solid var(--border); border-radius: 10px; padding: 10px;
    font-size: 14px; font-family: var(--serif); background: var(--surface); color: var(--ink); resize: vertical; margin-top: 6px;
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }

  .site-footer { text-align: center; font-size: 11px; color: var(--faint); padding: 30px 0 10px; }
  .site-footer a { color: var(--faint); }
</style>
</head>
<body>
<div id="app">
  <nav class="tabbar glass" id="tabbar"></nav>
  <main id="screen" class="screen"></main>
</div>
<script src="/p/editorial-os/data.js"></script>
<script src="/p/editorial-os/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Lab — Sign in</title>
<link rel="stylesheet" href="/assets/gallery.css">
<style>
  body { padding-top: 100px; }
  .login-wrap { max-width: 340px; margin: 0 auto; padding: 0 16px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .login-card h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
  .login-card p { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 20px; }
  .login-field { margin-bottom: 12px; }
  .login-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .login-field input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; box-sizing: border-box;
  }
  .login-submit {
    width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 6px;
  }
  .login-submit:disabled { opacity: 0.6; cursor: default; }
  .login-error { color: var(--accent); font-size: 12px; margin: 10px 0 0; text-align: center; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Idea Lab</h1>
    <p>Private — sign in to continue</p>
    <form id="loginForm">
      <div class="login-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-submit" id="submitBtn">Sign in</button>
      <p class="login-error" id="loginError">Incorrect email or password.</p>
    </form>
  </div>
</div>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const err = document.getElementById("loginError");
    err.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Signing in…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) {
        const params = new URLSearchParams(location.search);
        location.href = params.get("next") || "/";
      } else {
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    } catch {
      err.textContent = "Something went wrong — try again.";
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
